name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU only, no torch needed for AFE tests)
        run: pip install numpy scipy pyyaml pytest ruff
      - name: Lint
        run: ruff check .
      - name: AFE unit tests
        run: pytest tests/ -q
